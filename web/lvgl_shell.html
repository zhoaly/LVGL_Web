<!doctype html>
<html lang="en"
      data-lvgl-preview-layout="workspace"
      data-lvgl-preview-protocol="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LVGL UI Simulator</title>
  <script>
    if (window.parent !== window) {
      document.documentElement.dataset.lvglPreviewLayout = "device";
      document.documentElement.classList.add("lvgl-embedded");
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #0b0d10;
      color: #f7f7f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #242831 0, #111419 42%, #090a0d 100%);
    }

    .simulator-layout {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 22px;
      padding: 24px;
    }

    .device-stage {
      width: 272px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 34px;
      background: #171a20;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
    }

    #canvas {
      display: block;
      width: 240px;
      height: 320px;
      border: 0;
      border-radius: 24px;
      outline: none;
      background: #f8fafc;
    }

    .mock-panel {
      width: 300px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      background: rgba(24, 27, 33, 0.94);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
    }

    .panel-eyebrow {
      margin: 0 0 5px;
      color: #8d96a8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field,
    .toggle-field {
      display: grid;
      gap: 6px;
      color: #aab1be;
      font-size: 12px;
      font-weight: 600;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    input,
    select,
    button {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 11px;
      color: #f7f7f8;
      background: #22262e;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      padding: 0 10px;
    }

    .toggle-field {
      display: flex;
      min-height: 38px;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 11px;
      background: #1d2027;
    }

    .toggle-field input {
      width: 16px;
      min-height: 16px;
      accent-color: #ffffff;
    }

    .preset-grid,
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      padding: 0 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background 120ms ease, border-color 120ms ease,
                  transform 120ms ease;
    }

    button:hover {
      border-color: rgba(255, 255, 255, 0.3);
      background: #2d323c;
    }

    button:active {
      transform: translateY(1px);
    }

    .button-primary {
      color: #111318;
      background: #f7f7f8;
    }

    .button-primary:hover {
      background: #dfe3e8;
    }

    .panel-status {
      min-height: 18px;
      margin: 14px 0 0;
      color: #8d96a8;
      font-size: 11px;
    }

    html.lvgl-embedded,
    html.lvgl-embedded body {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    html.lvgl-embedded body {
      place-items: center;
      background: transparent;
    }

    html.lvgl-embedded::-webkit-scrollbar,
    html.lvgl-embedded body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    html.lvgl-embedded .simulator-layout {
      gap: 0;
      padding: 0;
    }

    html.lvgl-embedded .device-stage {
      width: 240px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    html.lvgl-embedded #canvas {
      border-radius: 0;
    }

    html.lvgl-embedded .mock-panel {
      display: none;
    }

    @media (max-width: 680px) {
      body {
        place-items: start center;
      }

      .simulator-layout {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <main class="simulator-layout">
    <section class="device-stage" aria-label="LVGL device preview">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </section>

    <aside class="mock-panel" aria-label="Mock data controls">
      <p class="panel-eyebrow">Developer tools</p>
      <h1>Mock Data</h1>

      <div class="field-grid">
        <label class="field">
          Time
          <input id="mock-time" type="time" value="09:41">
        </label>
        <label class="toggle-field">
          <input id="mock-time-synced" type="checkbox" checked>
          Synced
        </label>

        <label class="field">
          Temperature
          <input id="mock-temperature" type="number" min="-99" max="99" value="26">
        </label>
        <label class="toggle-field">
          <input id="mock-weather-available" type="checkbox" checked>
          Available
        </label>

        <label class="field field-wide">
          Wi-Fi
          <select id="mock-wifi">
            <option value="disconnected">Disconnected</option>
            <option value="connecting">Connecting</option>
            <option value="connected" selected>Connected</option>
          </select>
        </label>

        <label class="field field-wide">
          Bluetooth
          <select id="mock-bluetooth">
            <option value="off">Off</option>
            <option value="advertising">Advertising</option>
            <option value="connected" selected>Connected</option>
          </select>
        </label>
      </div>

      <div class="preset-grid" aria-label="Mock presets">
        <button type="button" data-mock-preset="offline">Offline</button>
        <button type="button" data-mock-preset="connecting">Connecting</button>
        <button type="button" data-mock-preset="online">Online</button>
        <button type="button" data-mock-preset="fully-connected">Fully connected</button>
      </div>

      <div class="action-grid">
        <button id="mock-apply" type="button" class="button-primary">Apply</button>
        <button id="mock-reset" type="button">Reset</button>
        <button id="mock-start-demo" type="button">Start demo</button>
        <button id="mock-stop-demo" type="button">Stop demo</button>
      </div>

      <p id="mock-status" class="panel-status" aria-live="polite">
        Waiting for simulator…
      </p>
    </aside>
  </main>

  <script>
    var Module = {
      canvas: document.getElementById("canvas")
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
